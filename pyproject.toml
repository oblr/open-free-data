[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "free-data"
version = "0.1.0"
description = "Search, cache and plot free public time series from German and French sources."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]
lint = ["ruff"]

[project.scripts]
free-data = "free_data.browser:main"
free-data-cache = "free_data.cache:main"
free-data-smard = "free_data.smard:main"
free-data-eco2mix = "free_data.eco2mix:main"
free-data-pegelonline = "free_data.pegelonline:main"
free-data-hubeau = "free_data.hubeau:main"
free-data-dwd = "free_data.dwd:main"
free-data-uba = "free_data.uba:main"

[tool.hatch.build.targets.wheel]
packages = ["src/free_data"]

# The browser page: web/ is a Node project, only the page and its compiled modules ship.
[tool.hatch.build.targets.wheel.force-include]
"web/index.html" = "free_data/web/index.html"
"web/dist" = "free_data/web/dist"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "web/index.html", "web/dist", "README.md"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py311"  # also reports syntax newer than the oldest supported Python

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["free_data", "conftest"]
