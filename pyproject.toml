[project]
name = "free-data"
version = "0.1.0"
description = "Search, cache and plot free public time series from German and French sources."
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
filterwarnings = ["error"]
