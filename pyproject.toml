[project]
name = "free-data"
version = "0.1.0"
description = "Search, cache and plot free public time series from German and French sources."
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]
lint = ["ruff"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py311"  # also reports syntax newer than the oldest supported Python

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["browser", "cache", "conftest", "dwd", "eco2mix", "hubeau", "pegelonline", "plugins", "smard", "sources", "vocabulary"]
